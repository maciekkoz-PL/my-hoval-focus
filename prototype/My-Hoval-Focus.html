<style>

<script>'use strict';
const $=s=>document.querySelector(s);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const shapes={today:'<rect x="3" y="5" width="18" height="16" rx="3"/><path d="M7 3v4m10-4v4M3 10h18m-14 4h4"/>',tickets:'<path d="M3 6h18v5a2 2 0 0 0 0 4v3H3v-3a2 2 0 0 0 0-4zM15 7v2m0 3v2m0 2v1"/>',sources:'<ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v7c0 4 16 4 16 0V5M4 12v6c0 4 16 4 16 0v-6"/>',flag:'<path d="M5 21V4c5-4 9 4 15 0v10c-6 4-10-4-15 0"/>',clock:'<circle cx="12" cy="12" r="9"/><path d="M12 6v6l4 2"/>',mail:'<rect x="3" y="5" width="18" height="14" rx="3"/><path d="m4 7 8 6 8-6"/>',chat:'<path d="M5 4h14a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2h-8l-6 4v-4H4a2 2 0 0 1-2-2V7a3 3 0 0 1 3-3Z"/><path d="M7 9h10M7 13h7"/>',arrow:'<path d="M4 12h15m-6-6 6 6-6 6"/>',check:'<path d="m4 12 5 5L20 6"/>',review:'<rect x="4" y="6" width="13" height="15" rx="2"/><path d="M8 3h11a2 2 0 0 1 2 2v12M8 11h5m-5 4h4"/>',close:'<path d="m6 6 12 12M18 6 6 18"/>',chev:'<path d="m9 5 7 7-7 7"/>',sun:'<path d="M3 17h18M6 14a6 6 0 0 1 12 0M12 2v3M3 7l2 2m16-2-2 2M6 21h12"/>',project:'<path d="M3 7V5h6l2 2h10v13H3z"/>',download:'<path d="M12 3v12m-5-5 5 5 5-5M4 18v3h16v-3"/>'};
const icon=k=>'<svg class="ico" aria-hidden="true" viewBox="0 0 24 24">'+shapes[k]+'</svg>';
const button=(label,action,style='btn',symbol='')=>'<button class="'+style+'" data-act="'+esc(action)+'">'+(symbol?icon(symbol):'')+esc(label)+
  '</button>';
const key='my-hoval-focus.today.v1';
function day(){
  const d=new Date();
  return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')}
function base(){
  return {tickets:[],notes:{},days:{},dismissed:[],imported:'',exported:'',complete:true,account:'',owner:''}}
function demo(){
  const w=base();
  w.tickets=[
['8200101','Release blocked invoice batch','High impact','Two finance users are waiting to complete billing.','Owner response','In progress'],
['C8200102','Validate the SAP test cutover','Change','The test window opens today. Confirm the rollback owner.','Test window','Assigned'],
['8200103','Confirm the warehouse label fix','Follow-up','A response was promised before the afternoon shift.','Promised today','In progress'],
['8200104','Check pricing rounding on returns','Support','Reproduce the rounding difference on a credit memo.','Ready to review','Assigned'],
['8200105','Review the delivery layout','Support','Waiting for a sample delivery from the requester.','Waiting for sample','Waiting for customer']
].map(([id,title,tag,reason,signal,status])=>({id,title,tag,reason,signal,status,latest:'',category:id.startsWith('C')?'change':'',target:'',urgent:false,impact:'',partial:false}));
  return w}
const messages=[{id:'warehouse',src:'Teams',title:'Can you check the warehouse label?',who:'Alex Morgan',context:'“The new label is on the test printer. Can you confirm the barcode scans before the afternoon shift?”',match:'8200103'},{id:'cutover',src:'Outlook',title:'Cutover checklist ready for review',who:'Robin Ellis',context:'“The revised checklist is ready. Could you confirm who owns rollback validation?”',match:'C8200102'}];
function fresh(){
  return {version:1,mode:'sample',sample:demo(),local:base()}}
function valid(snapshot) {
  if (!snapshot || snapshot.version !== 1 || !['sample', 'local'].includes(snapshot.mode)) return false;
  const record = value => value !== null && typeof value === 'object' && !Array.isArray(value);
  return ['sample', 'local'].every(mode => {
    const w = snapshot[mode];
    if (!record(w) || !Array.isArray(w.tickets) || !record(w.days) || !record(w.notes) || !Array.isArray(w.dismissed)) return false;
    if (!w.tickets.every(t => record(t) && /^(?:C)?\d+$/i.test(t.id) && typeof t.id === 'string' && typeof t.title === 'string')) return false;
    const ids = new Set(w.tickets.map(t => t.id));
    if (ids.size !== w.tickets.length || !Object.values(w.notes).every(n => typeof n === 'string')) return false;
    return Object.values(w.days).every(d => record(d) && Array.isArray(d.ids) &&
      d.ids.length <= 3 && new Set(d.ids).size === d.ids.length && d.ids.every(id => ids.has(id)) &&
      typeof d.accepted === 'boolean' && (!d.hours || (record(d.hours) && Object.values(d.hours).every(h => Number.isFinite(h) && h >= 0 && h <= 24))));
  });
}
let state=fresh(),storageOK=true,bootWarning='';
try{
  let raw=localStorage.getItem(key);
  if(raw){
    const s=JSON.parse(raw);
    if(valid(s))state=s;
    else throw Error()}localStorage.setItem(key+'.probe','1');
  localStorage.removeItem(key+'.probe')}catch{
  storageOK=false;
  bootWarning='Saved workspace could not be opened or storage is unavailable. Export a backup before closing.'}
let page='Today',fileAction='',reviewList=[],reviewPos=0,timer;
const work=()=>state[state.mode],sample=()=>state.mode==='sample',find=id=>work().tickets.find(t=>t.id===id);
function notify(t){
  clearTimeout(timer);
  $('#toast').textContent=t;
  timer=setTimeout(()=>$('#toast').textContent='',3500)}
function persist(){
  try{
    if(bootWarning)throw Error();
    localStorage.setItem(key,JSON.stringify(state));

    storageOK=false}render();
  if(!storageOK)notify('Session only. Export a workspace backup before closing.')}
const current=()=>work().tickets.filter(t=>!t.absent);
function ranked(){
  const score=t=>(/wait/i.test(t.status)?-15:0)+Number(t.urgent)*100+(/high|top|organization/i.test(t.impact)?30:0)+(t.target&&Number.isFinite(Date.parse(t.target))?Math.min(25,Math.max(0,21-(Date.parse(t.target)-Date.now())/864e5)):0);
  return current().slice().sort((a,b)=>score(b)-score(a)).map(t=>t.id)}
function plan(){
  const w=work();
  return w.days[day()]??={ids:ranked().slice(0,3),accepted:false,hours:{}}}
function reason(t){
  return t.reason||(t.urgent?'Marked urgent in Xurrent.':t.target?'Next target: '+t.target:t.impact?'Recorded impact: '+t.impact+'.':'Available for review. No stronger priority signal recorded.')}
function category(t){
  return /^C\d+$/i.test(t.id)||String(t.category).toLowerCase()==='change'?'Change hours':'Support hours'}
function chart(){
// Alpine relief drawn from a fixed elevation surface. All artwork renders offline.
let paths='';
  const h=(x,z)=>{
    const peak=(cx,cz,wx,wz,height)=>height*Math.exp(-Math.pow(Math.abs((x-cx)/wx)+Math.abs((z-cz)/wz),1.53));
    return peak(310,54,121,42,108)+peak(469,62,95,49,75)+peak(150,51,87,35,60)+7*Math.sin(x*.061+z*.12)*Math.exp(-((z-55)**2)/2400)+3*Math.sin(x*.11-z*.14)};
for(let z=0;z<=110;z+=2){
    let d='';
    for(let x=-45;x<=710;x+=4){
      const y=93+z*.96-h(x,z);
      d+=(x===-45?'M':'L')+x+','+y.toFixed(1)}paths+='<path d="'+d+' L710,240 L-45,240Z" fill="#e6ede6" stroke="#769385" stroke-width=".78"/>'}
return '<svg aria-hidden="true" viewBox="0 0 640 210" preserveAspectRatio="xMidYMid slice"><defs><pattern id="grid" width="27" height="27" patternUnits="userSpaceOnUse"><path d="M27 0H0V27" fill="none" stroke="#c1cec3" stroke-width=".6"/></pattern></defs><rect width="640" height="210" fill="url(#grid)"/>'+paths+
    '<path d="M310 39v-22l16 4-16 6" fill="#af283a" stroke="#a92538" stroke-width="1.7"/><circle cx="310" cy="39" r="2.5" fill="#a92538"/></svg>'}
function ticketMeta(t){
  return '<div class="meta"><span>'+esc(t.id)+'</span><span class="pill '+(t.urgent||t.tag==='High impact'?'urgent':'')+'">'+esc(t.absent?'Outside latest export':t.tag||t.status||'Unspecified')+
    '</span></div>'}
function today(){
  const p=plan(),items=p.ids.map(find).filter(Boolean),msgs=sample()?messages.filter(m=>!work().dismissed.includes(m.id)):[],waiting=current().filter(t=>/wait/i.test(t.status)),date=new Intl.DateTimeFormat('en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'}).format(new Date());
return '<section class="hero">'+chart()+'<div class="date">'+esc(date)+'</div><h1>Today’s focus.</h1><p>'+items.length+' '+(p.accepted?'confirmed':'suggested')+' priorities · '+msgs.length+' messages to review</p></section><div class="grid"><div class="leftflow"><section class="panel"><div class="panelhead"><div class="sectionhead">'+icon('flag')+
    '<h2>My top 3</h2></div><div class="row"><span class="tag">'+(p.accepted?'Confirmed':'Suggested')+'</span>'+(!p.accepted&&items.length?button('Edit','edit','link'):'')+
    '</div></div><p class="sub panelintro">'+(p.accepted?'Your plan for this workday.':'Review the reasons, then make the plan yours.')+'</p><div class="priorities">'+(items.map((t,i)=>'<button class="priority" data-act="detail:'+esc(t.id)+'"><span class="rank">0'+(i+1)+
    '</span><div class="details">'+ticketMeta(t)+'<h3>'+esc(t.title)+'</h3><div class="reason">'+esc(reason(t))+'</div></div></button>').join('')||'<p class="empty">Import tickets or add a ticket to your plan.</p>')+
    '</div><div class="paneltail">'+button(p.accepted?'Edit priorities':items.length?'Accept plan':'Choose priorities',p.accepted||!items.length?'edit':'accept','btn primary',p.accepted?'flag':'check')+button('Review tickets','review','link','review')+
    '</div></section><div class="below">'+icon('sun')+'<div><h3>Day wrap-up</h3><p class="tiny">Prepare your Toggl time entries.</p></div>'+button('Wrap up','wrap','btn','arrow')+
    '</div></div><div class="stack"><section class="panel"><div class="panelhead"><div class="sectionhead"><h2>Needs your action</h2><span class="count">'+msgs.length+
    '</span></div></div><div class="inbox">'+(msgs.map(m=>'<button class="msg" data-act="msg:'+m.id+'"><span class="source-icon '+(m.src==='Outlook'?'mail':'')+'">'+icon(m.src==='Teams'?'chat':'mail')+
    '</span><div><div class="meta">'+m.src+' · '+m.who+'</div><h3>'+m.title+'</h3></div></button>').join('')||'<p class="empty">'+(sample()?'All sample messages reviewed.':'Outlook and Teams are not connected.')+
    '</p>')+'</div></section><section class="panel"><div class="panelhead"><div class="sectionhead">'+icon('clock')+'<h2>Waiting for</h2><span class="count">'+waiting.length+
    '</span></div></div><div class="waiting">'+(waiting.slice(0,2).map(t=>'<button class="msg" data-act="detail:'+esc(t.id)+'"><div>'+ticketMeta(t)+
    '<h3>'+esc(t.title)+'</h3><p class="tiny">'+esc(t.reason||t.status)+'</p></div></button>').join('')||'<p class="empty">No tickets with a waiting status.</p>')+(waiting.length>2?button('Show all waiting tickets','waiting','link'):'')+
    '</div></section></div></div>'}
function ticketRows(list){
  return list.map(t=>'<button class="ticket" data-act="detail:'+esc(t.id)+'"><div class="details">'+ticketMeta(t)+'<strong>'+esc(t.title)+'</strong></div>'+icon('chev')+
    '</button>').join('')||'<div class="box sub">No matching tickets.</div>'}
let search='';
function filtered(){
  const q=search.toLowerCase();
  return work().tickets.filter(t=>[t.id,t.title,t.status].some(v=>String(v).toLowerCase().includes(q)))}
function tickets(){
  return '<div class="pagehead"><div><h1>Tickets</h1><p class="sub">'+current().length+' tickets in the current snapshot</p></div>'+button('Import tickets','import','btn','download')+
    '</div><input class="searchfield" id="search" aria-label="Find tickets" placeholder="Find a ticket by reference, title or status" value="'+esc(search)+'"><section class="panel" id="results">'+ticketRows(filtered())+
    '</section>'}
function sources(){
  const w=state.local;
  return '<div class="pagehead"><div><h1>Sources</h1><p class="sub">Your files and workspace on this device.</p></div></div><section class="panel"><div class="box"><h3>Xurrent ticket export</h3><p class="sub">Select a JSON export from Ticket Asystent. Your plan and personal notes follow each ticket when you import it again.</p>'+(w.imported?'<p class="tiny">Exported '+esc(w.exported||'at an unknown time')+' · Imported '+esc(w.imported)+
    '</p>':'')+'<div class="actiongroup">'+button('Import tickets','import','btn primary','download')+button('Download sample JSON','fixture')+
    '</div></div><div class="box"><h3>Workspace backup</h3><p class="sub">Back up your tickets, notes and decisions to a JSON file you keep on this device.</p><div class="actiongroup">'+button('Export backup','backup')+button('Restore backup','restore')+
    '</div></div><div class="box"><h3>Sample workspace</h3><p class="sub">Explore the morning plan with fictional tickets and messages.</p><div class="actiongroup">'+button(sample()?'Open sample Today':'Switch to sample','sample')+(w.imported?button('Open imported workspace','local'):'')+
    '</div></div></section>'}
function render(){
  const views={Today:today,Tickets:tickets,Sources:sources};
  $('#nav').innerHTML=Object.keys(views).map((v,i)=>'<button class="nav '+(page===v?'active':'')+'" '+(page===v?'aria-current="page"':'')+' data-act="page:'+v+'">'+icon(['today','tickets','sources'][i])+v+(v==='Tickets'?'<em>'+current().length+
    '</em>':'')+'</button>').join('');
  $('#crumb').textContent=page;
  document.title=page+' · My Hoval Focus';
  $('#mode').textContent=sample()?'Sample workspace':'Local import';
  $('#view').innerHTML=(!storageOK?'<p class="notice">Session only. Use Sources → Export backup before closing.</p>':'')+(!sample()&&!work().complete?'<p class="notice">Partial source export. Earlier tickets and available notes have been retained.</p>':'')+views[page]()}
function openDialog(title,body){
  const el=$('#modal');
  el.innerHTML=button('','close','close','close')+'<h2 id="modalTitle">'+esc(title)+'</h2>'+body;
  el.querySelector('.close').setAttribute('aria-label','Close dialog');
  if(!el.open)el.showModal();
  el.scrollTop=0}
function close(){
  if($('#modal').open)$('#modal').close()}
const actions=(...items)=>'<div class="actiongroup">'+items.join('')+'</div>';
function edit(focusId=''){
  const p=plan(),all=current();
  if(!all.length){
    openDialog('Plan priorities','<p>Import a ticket file to choose your priorities.</p>');
    return}const candidates=Array.from(new Set([...all.map(t=>t.id),...p.ids])).map(find).filter(Boolean);
  const initial=p.ids.slice();
  if(focusId&&!initial.includes(focusId)&&initial.length<3)initial.push(focusId);
  openDialog('Edit priorities','<p class="sub">'+(focusId&&!initial.includes(focusId)?'Choose which priority to replace with '+esc(focusId)+'.':'Choose up to three tickets in the order you want to tackle them.')+
    '</p>'+[0,1,2].map(i=>'<label class="field">Priority '+(i+1)+'<select id="slot'+i+'"><option value="">Leave open</option>'+candidates.map(t=>'<option value="'+esc(t.id)+'" '+(t.id===initial[i]?'selected':'')+'>'+esc(t.id+' · '+t.title)+
    '</option>').join('')+'</select></label>').join('')+'<p role="alert" id="err"></p>'+actions(button('Save plan','saveplan','btn primary','check')))}
let activeId='';
function detail(id,review=false){
  const t=find(id);
  if(!t)return;
  activeId=id;
  const p=plan();
  openDialog(review?'Ticket review':'Ticket details','<div class="meta">'+(review?'Ticket '+(reviewPos+1)+' of '+reviewList.length+' · ':'')+esc(t.id)+' · '+esc(t.status||'Status unknown')+
    '</div><h3>'+esc(t.title)+'</h3><p class="sub">'+esc(reason(t))+'</p>'+(t.partial?'<p class="notice">Partial ticket or notes read.</p>':'')+(t.latest?'<div class="box"><strong>Latest source note</strong><pre>'+esc(t.latest)+
    '</pre></div>':'')+'<label class="field">My next action<textarea id="note" placeholder="Write a private next step…">'+esc(work().notes[id]||'')+
    '</textarea></label>'+actions(button(review?'Save & next':'Save note',review?'next':'savenote','btn primary'),button(review?'Skip':p.ids.includes(id)?'Edit priorities':'Add to top 3',review?'skip':'promote')))}
function msg(id){
  const m=messages.find(x=>x.id===id);
  if(!sample()||!m)return;
  openDialog('Review message','<div class="meta">'+m.src+' · '+m.who+'</div><h3>'+m.title+'</h3><p>'+m.context+'</p><p class="sub">Related sample ticket · '+m.match+
    '</p>'+actions(button('Open ticket','detail:'+m.match,'btn primary'),button('Mark reviewed','dismiss:'+m.id)))}
function wrap(){
  const p=plan(),list=p.ids.map(find).filter(Boolean);
  openDialog('Wrap up my day','<p class="sub">Estimate hours actually worked on each topic. Adjust the draft before copying it to Toggl.</p>'+(list.length?list.map(t=>'<label class="wraprow"><span><strong>'+esc(t.id)+
    '</strong> · '+esc(t.title)+'<br><small>'+category(t)+'</small></span><input type="number" min="0" max="24" step="0.25" data-hour="'+esc(t.id)+'" aria-label="Hours for '+esc(t.id)+'" value="'+esc(p.hours?.[t.id]??0)+'"></label>').join('')+
    '<p id="total"></p><p id="err" role="alert"></p>'+actions(button('Prepare entries','prepare','btn primary')):'<p>Choose priorities first to prepare time entries.</p>'));
  if(list.length)total()}
function total(){
  const sum=Array.from(document.querySelectorAll('[data-hour]')).reduce((a,n)=>a+(Number(n.value)||0),0);
  $('#total').textContent='Total · '+sum.toLocaleString('en-GB',{maximumFractionDigits:2})+' h'}
function download(name,data){
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob),a=document.createElement('a');
  a.href=url;
  a.download=name;
  document.body.append(a);
  a.click();
  a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1000)}
function fixture(){
  return {exported_at:new Date().toISOString(),account:'example-workspace',count:3,complete:true,requests:demo().tickets.slice(0,3).map((t,i)=>({details:{id:9100001+i,subject:t.title,status:'assigned',category:'incident',impact:i===0?'high':'low',urgent:i===0},notes:[{text:'Synthetic import test.',created_at:'2026-01-01T08:00:00Z'}],notes_read:true,details_read:true}))}}
function normalize(o){
  if(!o||!Array.isArray(o.requests)||!('complete' in o)||typeof o.complete!=='boolean')throw Error('Choose a Ticket Asystent export containing requests and a completeness flag.');
  if(o.count!==undefined&&o.count!==o.requests.length)throw Error('Ticket count does not match the export.');
  const seen=new Set();
  const list=o.requests.map(row=>{
    const d=row?.details,id=String(d?.id??'').trim();
    if(!/^(?:C)?\d+$/i.test(id)||seen.has(id))throw Error('The export contains a missing, invalid or duplicate ticket reference.');
    seen.add(id);
    if(!row||!d||typeof d.subject!=='string'||!d.subject.trim())throw Error('An exported ticket is missing its subject.');
    const ordered=(Array.isArray(row.notes)?row.notes:[]).filter(n=>n&&typeof n.text==='string').slice().sort((a,b)=>String(b.created_at||'').localeCompare(String(a.created_at||'')));
    return {id,title:d.subject,status:String(d.status||''),category:String(d.category||''),impact:String(d.impact||''),target:String(d.next_target_at||''),urgent:d.urgent===true,latest:ordered[0]?.text||'',partial:row.details_read===false||row.notes_read===false,notesRead:row.notes_read!==false,detailsRead:row.details_read!==false}});
  return {list,complete:o.complete,exported:String(o.exported_at||''),account:String(o.account||''),owner:String(o.user?.id||'')}}
function importFile(o){
  const x=normalize(o),old=state.local;
  if(old.imported&&(old.account!==x.account||old.owner!==x.owner))throw Error('This export belongs to a different account or ticket owner. The current workspace was preserved.');
  if(old.exported&&x.exported&&Date.parse(x.exported)<Date.parse(old.exported))throw Error('This export is older than the last import. The current workspace was preserved.');
const previous=new Map(old.tickets.map(t=>[t.id,t])),incoming=new Set(x.list.map(t=>t.id));
  const rows=x.list.map(t=>{
    const prev=previous.get(t.id);
    if(!prev)return t;
    const merged={...t};
    if(!t.notesRead&&!t.latest)merged.latest=prev.latest;
    if(!t.detailsRead&&!t.urgent)merged.urgent=prev.urgent;
    if(!t.detailsRead)for(const k of ['target','impact','category','status'])if(!merged[k])merged[k]=prev[k];
    return merged});
  for(const t of old.tickets)if(!incoming.has(t.id))rows.push({...t,absent:x.complete||!!t.absent});
  state.local={...old,tickets:rows,account:x.account,owner:x.owner,complete:x.complete,exported:x.exported,imported:new Date().toISOString()};
  state.mode='local';
  page='Today';
  persist();
  notify(x.list.length+' tickets imported'+(x.complete?'': ' · partial snapshot'))}
let pendingBackup=null;
$('#picker').addEventListener('change',async e=>{
  const file=e.target.files[0];
  if(!file)return;
  const kind=fileAction;
  e.target.value='';
  try{
    const text=await file.text(),o=JSON.parse(text.replace(/^\uFEFF/,''));
    if(kind==='restore'){
      if(!valid(o))throw Error('This file is not a My Hoval Focus workspace backup.');
      pendingBackup=o;
      openDialog('Restore workspace?','<p>This replaces the current sample and imported workspace with the selected backup.</p>'+actions(button('Restore workspace','confirmrestore','btn primary'),button('Cancel','close')))}else importFile(o)}catch(err){
    openDialog('File could not be loaded','<p>'+esc(err instanceof SyntaxError?'The selected file does not contain valid JSON.':err.message)+
      '</p>')}});
document.addEventListener('input',e=>{
  if(e.target.id==='search'){
    search=e.target.value;
    $('#results').innerHTML=ticketRows(filtered())}if(e.target.hasAttribute('data-hour'))total()});
document.addEventListener('click',async e=>{
  const hit=e.target.closest('[data-act]');
  if(!hit)return;
  const [a,arg]=hit.dataset.act.split(':');
  switch(a){
case 'page':page=arg;
    search='';
    render();
    window.scrollTo(0,0);
    break;
case 'close':close();
    break;
case 'accept':plan().accepted=true;
    persist();
    notify('Plan confirmed for today');
    break;
case 'detail':detail(arg);
    break;
case 'edit':edit();
    break;
case 'promote':work().notes[activeId]=$('#note').value;
    persist();
    edit(activeId);
    break;
case 'saveplan':{const ids=[0,1,2].map(i=>$('#slot'+i).value).filter(Boolean);
      if(new Set(ids).size!==ids.length){
        $('#err').textContent='Choose each ticket only once.';
        break}plan().ids=ids;
      plan().accepted=true;
      close();
      persist();
      notify('Priorities saved');
      break}
case 'review':reviewList=current().map(t=>t.id);
    if(reviewList.length){
      const pos=reviewList.indexOf(work().reviewCursor);
      reviewPos=Math.max(0,pos);
      detail(reviewList[reviewPos],true)}else openDialog('Ticket review','<p>Import tickets to start a review.</p>');
    break;
case 'savenote':case 'next':case 'skip':{if(a!=='skip')work().notes[activeId]=$('#note').value;
      if(a==='savenote'){
        close();
        persist();
        notify('Personal note saved');
        break}reviewPos++;
      work().reviewCursor=reviewList[reviewPos]||'';
      persist();
      if(reviewPos<reviewList.length)detail(reviewList[reviewPos],true);
      else openDialog('Review complete','<p>You reached the end of the ticket list. Your saved next actions are available in ticket details.</p>'+actions(button('Done','close','btn primary')));
      break}
case 'waiting':openDialog('Waiting for',ticketRows(current().filter(t=>/wait/i.test(t.status))));
    break;
case 'msg':msg(arg);
    break;
case 'dismiss':work().dismissed.push(arg);
    close();
    persist();
    notify('Message marked as reviewed');
    break;
case 'wrap':wrap();
    break;
case 'prepare':{const entries=[],hours={};
      let sum=0;
      for(const el of document.querySelectorAll('[data-hour]')){
        const t=find(el.dataset.hour),h=Number(el.value);
        if(!el.validity.valid||!Number.isFinite(h)){
           $('#err').textContent='Enter hours in quarter-hour steps, between 0 and 24.';
          return}hours[t.id]=h;
        sum+=h;
        if(h>0)entries.push(t.id+' - '+t.title+'\n'+category(t)+' · '+h+' h')}if(sum<=0||sum>24){
        $('#err').textContent='Enter a daily total above zero and at most 24 hours.';
        break}plan().hours=hours;
      persist();
      openDialog('Toggl draft','<p class="sub">Review and copy your entries · '+sum+' h</p><label class="field">Entries<textarea id="copytext" readonly></textarea></label>'+actions(button('Copy entries','copy','btn primary'),button('Edit hours','wrap')));
      $('#copytext').value=entries.join('\n\n');
      break}
case 'copy':{const t=$('#copytext');
      t.focus();
      t.select();
      try{
        await navigator.clipboard.writeText(t.value);
        notify('Entries copied')}catch{
        if(!document.execCommand('copy'))openDialog('Copy entries','<p>Select the entries and press Ctrl+C.</p><textarea readonly id="manualcopy"></textarea>');
        if($('#manualcopy')){
          $('#manualcopy').value=t.value;
          $('#manualcopy').select()}}break}
case 'sample':case 'local':state.mode=a;
    page='Today';
    persist();
    break;
case 'import':case 'restore':fileAction=a;
    $('#picker').click();
    break;
case 'fixture':download('focus-synthetic-tickets.json',fixture());
    break;
case 'backup':download('my-hoval-focus-backup-'+day()+'.json',state);
    break;
case 'confirmrestore':if(pendingBackup){
      state=pendingBackup;
      pendingBackup=null;
      bootWarning='';
      page='Today';
      close();
      persist();
      notify('Workspace restored')}break;
}});
render();
if(bootWarning)notify(bootWarning);
</script></body></html>
